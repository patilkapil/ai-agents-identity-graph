<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Okta for AI Agents — Entity Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --bg:#0f1117;--surface:#1a1d27;--surface2:#252836;--border:#2e3248;
  --text:#e2e4ed;--dim:#7c81a0;--accent:#6366f1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
header h1{font-size:14px;font-weight:700;white-space:nowrap}
.badge{background:#6366f120;border:1px solid #6366f150;color:#818cf8;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.source-link{font-size:10px;color:var(--dim);text-decoration:none;white-space:nowrap}
.source-link:hover{color:var(--accent)}
.main{display:flex;flex:1;overflow:hidden}
#gc{flex:1;position:relative;overflow:hidden}
svg{width:100%;height:100%;touch-action:none}
#panel{width:520px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:24px;gap:10px}
.ph p{font-size:12px;line-height:1.6;max-width:260px}
.ph svg{opacity:.25}
#pca{display:none;flex-direction:column;height:100%}
.phead{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.ptbadge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ptitle{font-size:15px;font-weight:600}
.ptabs{display:flex;border-bottom:1px solid var(--border)}
.ptab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.ptab.active{color:var(--text);border-bottom-color:var(--accent)}
.pbody{flex:1;overflow-y:auto;padding:14px 16px}
.pbody::-webkit-scrollbar{width:4px}
.pbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.fgrp{margin-bottom:14px}
.fgtitle{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:7px}
.frow{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)20;align-items:flex-start}
.frow:last-child{border-bottom:none}
.fname{font-size:12px;color:#818cf8;font-family:'SF Mono','Fira Code',monospace;min-width:145px;flex-shrink:0;line-height:1.6;word-break:break-all}
.fval{font-size:12px;color:var(--text);font-family:'SF Mono','Fira Code',monospace;word-break:break-all;line-height:1.6}
.fdesc{font-size:14px;color:#9aa5c8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;line-height:1.65;margin-top:3px}
.api-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px}
.api-head{display:flex;align-items:center;gap:8px;padding:9px 12px}
.method{padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.05em}
.api-title{font-size:13px;font-weight:500;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;line-height:1.4;flex:1}
.api-docs{font-size:10px;color:var(--accent);text-decoration:none;white-space:nowrap;opacity:.75;flex-shrink:0}
.api-docs:hover{opacity:1;text-decoration:underline}
.api-desc{font-size:12px;color:#9aa5c8;padding:0 12px 8px;line-height:1.5;border-top:1px solid var(--border);padding-top:7px;margin-top:-1px}
.api-body{padding:0 12px 11px}
.code-block{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:9px 10px;font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:#a5f3fc;position:relative;margin-top:6px;overflow-x:auto;white-space:pre;line-height:1.6}
.copy-btn{position:absolute;top:4px;right:4px;background:var(--surface2);border:1px solid var(--border);color:var(--dim);font-size:10px;padding:2px 5px;border-radius:3px;cursor:pointer;transition:color .15s}
.copy-btn:hover{color:var(--text)}
.step-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:8px}
.step-head{display:flex;align-items:center;gap:9px;padding:9px 12px}
.step-num{width:18px;height:18px;border-radius:50%;background:var(--accent);color:white;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-title{font-size:13px;font-weight:500;line-height:1.45;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
.step-body{padding:0 12px 11px}
.chain-arrow{text-align:center;color:var(--dim);font-size:14px;margin:2px 0}
.info{background:#6366f110;border:1px solid #6366f130;border-radius:4px;padding:10px 12px;font-size:13.5px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#b0bcf8;margin-bottom:10px;line-height:1.75}
.use-when{background:#10b98110;border:1px solid #10b98130;border-radius:4px;padding:10px 12px;font-size:13.5px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#6ee7b7;margin-bottom:10px;line-height:1.75}
.use-when strong{font-weight:700;color:#34d399}
.orn{background:#6366f110;border:1px solid #6366f130;border-radius:4px;padding:5px 8px;font-family:monospace;font-size:10px;color:#818cf8;word-break:break-all;margin:6px 0}
.needs-row{display:flex;flex-wrap:wrap;gap:5px;padding:6px 0 8px;align-items:center}
.needs-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600;white-space:nowrap}
.needs-chip.param{background:#f59e0b18;border:1px solid #f59e0b50;color:#fbbf24}
.needs-chip.token{background:#10b98118;border:1px solid #10b98150;color:#34d399}
.needs-chip.scope{background:#6366f118;border:1px solid #6366f150;color:#818cf8}
.needs-chip.role{background:#ef444418;border:1px solid #ef444450;color:#f87171}
.needs-label{font-size:10.5px;color:var(--dim);font-weight:600;margin-right:2px;flex-shrink:0}
.link{stroke-width:1.5;fill:none;opacity:.7;cursor:pointer;transition:opacity .15s,stroke-width .15s}
.link:hover{opacity:1;stroke-width:3}
.link.sel{opacity:1;stroke-width:3;stroke:#ffffff !important}
.nc{cursor:pointer}
.nc:hover circle,.nc:hover rect{filter:brightness(1.3)}
.nc.sel circle,.nc.sel rect{filter:brightness(1.4) drop-shadow(0 0 7px var(--c,#fff))}
.etip{position:fixed;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:11px;padding:4px 10px;border-radius:20px;pointer-events:none;z-index:200;white-space:nowrap;display:none;box-shadow:0 2px 8px #0005}
.elabel{font-size:13px;fill:var(--text);pointer-events:none;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.nlabel{font-size:13px;fill:var(--text);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.nid{font-size:8px;fill:var(--dim);pointer-events:none;text-anchor:middle}
.zc{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:4px}
.zb{width:26px;height:26px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}
kbd{background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:9px;font-family:monospace}
/* ── Mobile layout ── */
/* ── Sample Flows drawer ── */
.flows-btn{background:#6366f120;border:1px solid #6366f150;color:#818cf8;font-size:11px;font-weight:600;padding:4px 12px;border-radius:99px;cursor:pointer;transition:background .15s;white-space:nowrap;margin-left:auto}
.flows-btn:hover{background:#6366f130}
#flows-drawer{position:fixed;top:0;right:0;width:600px;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;box-shadow:-4px 0 24px #0006}
#flows-drawer.open{transform:translateX(0)}
.fd-hdr{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.fd-hdr-title{font-size:16px;font-weight:700}
.fd-hdr-sub{font-size:12px;color:var(--dim);margin-top:1px}
.fd-close{background:none;border:none;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.fd-close:hover{color:var(--text)}
.fd-body{flex:1;overflow-y:auto;padding:12px 14px}
.fd-body::-webkit-scrollbar{width:4px}
.fd-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.flow-acc{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:9px}
.flow-acc-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:var(--surface2);user-select:none}
.flow-acc-hd:hover{background:#2a2d3e}
.flow-idx{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.flow-name{font-size:14px;font-weight:600;flex:1;line-height:1.4}
.flow-chev{color:var(--dim);font-size:10px;transition:transform .2s;flex-shrink:0}
.flow-acc.open .flow-chev{transform:rotate(180deg)}
.flow-bd{display:none;padding:12px 14px;border-top:1px solid var(--border)}
.flow-acc.open .flow-bd{display:block}
.flow-desc{font-size:13.5px;color:#9aa5c8;line-height:1.65;margin-bottom:12px}
.fstep{background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;overflow:hidden}
.fstep-hd{display:flex;align-items:center;gap:8px;padding:8px 11px}
.fstep-n{width:20px;height:20px;border-radius:50%;background:#6366f128;border:1px solid #6366f155;color:#a5b4fc;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fstep-t{font-size:13.5px;font-weight:600;line-height:1.4}
.fstep-call{display:flex;align-items:flex-start;gap:8px;padding:0 11px 8px}
.fstep-path{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:#a5f3fc;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.fstep-io{padding:0 11px 9px}
.io-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);display:block;margin-bottom:4px;margin-top:7px}
.io-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;padding:3px 0;border-bottom:1px solid var(--border)18}
.io-row:last-child{border-bottom:none}
.io-n{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:#818cf8;min-width:120px;flex-shrink:0;line-height:1.5}
.io-v{font-size:12px;color:var(--dim);flex:1;min-width:0;word-break:break-all;line-height:1.5}
.io-link{font-size:11.5px;color:#34d399;white-space:normal;word-break:break-word;flex-basis:100%;padding-left:126px;line-height:1.4}
.fstep-note{font-size:13px;color:#9aa5c8;padding:0 11px 10px;line-height:1.65;font-style:italic;border-top:1px solid var(--border)25;padding-top:8px;margin-top:2px}
.fstep-arr{text-align:center;color:var(--dim);font-size:13px;padding:1px 0 2px}
/* ── Mobile layout — must be last to win the cascade ── */
@media (max-width:768px){
  header{flex-wrap:wrap;gap:6px}
  .flows-btn{margin-left:0}
  .main{flex-direction:column}
  #gc{height:55vh;flex:none}
  #panel{width:100%;height:45vh;border-left:none;border-top:1px solid var(--border);flex-shrink:0;overflow:hidden}
  #pca{height:100%;min-height:0}
  .pbody{min-height:0;padding-bottom:48px;-webkit-overflow-scrolling:touch}
  #flows-drawer{width:100%;left:auto;right:-100%;transform:none;transition:right .25s ease}
  #flows-drawer.open{right:0}
  .fd-hdr{padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
  .fd-hdr>div{flex:1;min-width:0;overflow:hidden}
  .fd-hdr-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fd-close{flex-shrink:0;font-size:28px;padding:0 8px;line-height:1}
  .fd-body{padding:10px;overflow-x:hidden;box-sizing:border-box;width:100%}
  .flow-acc{overflow:hidden;box-sizing:border-box}
  .flow-acc-hd{padding:10px}
  .flow-bd{padding:10px;box-sizing:border-box}
  .flow-desc{word-break:break-word;overflow-wrap:break-word}
  .fstep{overflow:hidden;box-sizing:border-box}
  .fstep-hd{padding:8px 10px}
  .fstep-call{padding:0 10px 8px}
  .fstep-path{white-space:pre-wrap;word-break:break-all;overflow-wrap:break-word}
  .fstep-io{padding:0 10px 9px}
  .io-row{flex-wrap:wrap}
  .io-n{min-width:80px;font-size:11px;flex-shrink:1}
  .io-v{font-size:11px;word-break:break-all;min-width:0}
  .io-link{padding-left:0;font-size:10.5px;word-break:break-word;width:100%}
  .fstep-note{padding:8px 10px 10px;word-break:break-word}
}
</style>
</head>
<body>
<header>
  <h1>Okta for AI Agents — Entity Graph</h1>
  <button class="flows-btn" onclick="toggleFlows()">Sample Flows ↗</button>
</header>
<div class="main">
  <div id="gc">
    <svg id="graph"></svg>
    <div class="zc">
      <button class="zb" id="zin">+</button>
      <button class="zb" id="zout">−</button>
      <button class="zb" id="zfit" style="font-size:10px">⊡</button>
    </div>
  </div>
  <div id="panel">
    <div class="ph" id="ph">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="9"/><line x1="12" y1="15" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="22" y2="12"/>
      </svg>
      <p>Click a <strong>node</strong> to see its full schema and API endpoints.<br><br>Click an <strong>edge</strong> to see the identifier join and step-by-step API chain.</p>
    </div>
    <div id="pca">
      <div class="phead" id="phead"></div>
      <div class="ptabs" id="ptabs"></div>
      <div class="pbody" id="pbody"></div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// DATA — grounded in Okta developer documentation
// Sources:
//  · developer.okta.com/docs/api/secures-ai  (Okta for AI Agents API)
//  · developer.okta.com/docs/guides/ai-agent-token-exchange/
//  · developer.okta.com/docs/reference/system-log-query/
//  · developer.okta.com/docs/concepts/auth-servers/
//  · developer.okta.com/docs/api/openapi/okta-management (Users, Apps, Logs)
// ════════════════════════════════════════════════════════════════

const NT = {
  USER:       {label:'User',              color:'#3b82f6', pre:'00u',  lines:['User']},
  AI_AGENT:   {label:'AI Agent',          color:'#f59e0b', pre:'wlp',  lines:['AI Agent']},
  APP:        {label:'OAuth App',         color:'#06b6d4', pre:'0oa',  lines:['OAuth','App']},
  MCP_SRV:    {label:'MCP Server',        color:'#ef4444', pre:'ems',  lines:['MCP','Server']},
  VIRT_MCP:   {label:'Agent Gateway',      color:'#84cc16', pre:'wlp',  lines:['Agent','Gateway']},
  CONN:       {label:'Resource Conn.',    color:'#ec4899', pre:'con',  lines:['Resource','Conn.']},
  LOG:        {label:'System Log Event',  color:'#94a3b8', pre:'uuid', lines:['System Log','Event']},
  POLICY:     {label:'Policy Rule',       color:'#f97316', pre:'0pr',  lines:['Policy','Rule']},
};

const NODES = [
  {
    id:'user1', type:'USER', label:'Human User',
    orn: null,
    summary:'This is the person who kicks everything off. They sign in, and from that moment their identity travels with every action the agent takes on their behalf — tucked into the JWT as the sub claim. So even when an agent is three hops deep into a workflow, you can always trace it back to the human who started it. That traceability is the whole point: agents act, but users are accountable.',
    schema:{
      'Identity':[
        {n:'id',    v:'00uABCDEF1234567890', d:'Used as {userId} in /api/v1/users/{userId} and as the sub claim in delegated JWTs'},
        {n:'login', v:'inna@company.com',    d:'Used to search for the user: /api/v1/users?q={login}'},
      ],
      'In Tokens / Logs':[
        {n:'sub (JWT)',      v:'00uABCDEF1234567890', d:'Appears as sub in every delegated access token — links the token back to this user'},
        {n:'actor.id (log)', v:'00uABCDEF1234567890', d:'Filter System Log by this value to find all actions this user performed'},
      ],
    },
    apis:[
      {method:'GET', label:'Retrieve user',
       path:'/api/v1/users/{userId}',
       curl:'curl -X GET \\\n  \'https://{yourOktaDomain}/api/v1/users/00uABCDEF1234567890\' \\\n  -H \'Authorization: SSWS {apiToken}\'',
       scope:'okta.users.read', ret:'User: id, login, status, profile, created, lastUpdated'},
      {method:'GET', label:'Find user events in System Log',
       path:'/api/v1/logs?filter=actor.id eq "{userId}"',
       curl:'curl -X GET \\\n  \'https://{yourOktaDomain}/api/v1/logs?filter=actor.id%20eq%20%2200uABCDEF1234567890%22\' \\\n  -H \'Authorization: SSWS {apiToken}\'',
       scope:'okta.logs.read', ret:'LogEvent[]: use actor.id=wlp… to see delegated agent actions'},
      {method:'GET', label:'List user\'s app assignments',
       path:'/api/v1/apps?filter=user.id eq "{userId}"',
       curl:'curl -X GET \\\n  \'https://{yourOktaDomain}/api/v1/apps?filter=user.id%20eq%20%2200uABCDEF%22\' \\\n  -H \'Authorization: SSWS {apiToken}\'',
       scope:'okta.apps.read', ret:'Application[] the user has access to'},
    ],
  },
  {
    id:'agent_orch', type:'AI_AGENT', label:'Orchestrator Agent',
    summary:'The Orchestrator Agent is the top-level AI agent that a user delegates to. It holds an OAuth identity (wlp… ID), connects to resources via Resource Connections (MCP servers, sub-agents, XAA apps), and acts on behalf of users through token exchange. Every downstream action — whether calling a tool, delegating to a sub-agent, or accessing an app — traces back to this agent\'s identity in System Log.',
    orn:'orn:okta:directory:{orgId}:workload-principals:ai-agents:wlps2fwpkzi3raviM1d7',
    schema:{
      'Identity':[
        {n:'id',          v:'wlps2fwpkzi3raviM1d7', d:'Used as {agentId} in every AI Agents API path — /ai-agents/{agentId}, /ai-agents/{agentId}/connections, etc.'},
        {n:'profile.name',v:'CopilotOrchestrator',  d:'Unique display name in the org. Appears in Admin UI and System Log events.'},
      ],
      'In Tokens':[
        {n:'client_id',   v:'wlps2fwpkzi3raviM1d7', d:'The agent\'s id IS its OAuth client_id — use this to find the backing OAuth app via GET /api/v1/apps?q={id}'},
        {n:'act.sub',     v:'wlps2fwpkzi3raviM1d7', d:'Appears in delegated JWTs when this agent is acting on behalf of a user'},
      ],
      'In System Log':[
        {n:'actor.id',    v:'wlps2fwpkzi3raviM1d7', d:'Filter logs by this to find all actions this agent performed: filter=actor.id eq "wlp..."'},
        {n:'actor.type',  v:'WorkloadPrincipal',     d:'Use this to distinguish agent events from user events in log queries'},
        {n:'target[].id', v:'wlps2fwpkzi3raviM1d7', d:'Filter events where this agent is the TARGET (e.g. admin activating or deactivating it): filter=target.id eq "wlp..."'},
      ],
    },
    apis:[
      {method:'GET', label:'Retrieve AI agent',
       path:'/workload-principals/api/v1/ai-agents/{agentId}',
       curl:'curl -X GET \\\n  \'https://{yourOktaDomain}/workload-principals/api/v1/ai-agents/wlps2fwpkzi3raviM1d7\' \\\n  -H \'Authorization: Bearer {accessToken}\'',
       scope:'okta.aiAgents.read', role:'SUPER_ADMIN',
       ret:'AIAgent: id, externalId, status, platform, profile, created, lastUpdated, _embedded'},
      {method:'GET', label:'List all AI agents',
       path:'/workload-principals/api/v1/ai-agents',
       curl:'curl -X GET \\\n  \'https://{yourOktaDomain}/workload-principals/api/v1/ai-agents\' \\\n  -H \'Authorization: Bearer {accessToken}\'',
       scope:'okta.aiAgents.read', ret:'Paginated AIAgent[]'},
      {method:'GET', label:'List agent\'s resource connections',
       path:'/workload-principals/api/v1/ai-agents/{agentId}/connections',
       curl:'curl -X GET \\\n  \'https://{yourOktaDomain}/workload-principals/api/v1/ai-agents/wlps2fwpkzi3raviM1d7/connections\' \\\n  -H \'Authorization: Bearer {accessToken}\'',
       scope:'okta.aiAgents.read', ret:'ResourceConnection[]: id, orn, status, connectionType, authorizationServer, scopes'},

// Banner dimensions for the log1 observability plane node
const LOG_BW = 800, LOG_BH = 36;

// Find where a ray from banner center (src) toward tgt exits the banner rect boundary
function bannerExit(src, tgt){
  const dx = tgt.x - src.x, dy = tgt.y - src.y;
  const hw = LOG_BW/2, hh = LOG_BH/2;
  let t = Infinity;
  if(dy > 0) t = Math.min(t, hh / dy);       // bottom edge
  if(dy < 0) t = Math.min(t, -hh / dy);      // top edge
  if(dx > 0) t = Math.min(t, hw / dx);        // right edge
  if(dx < 0) t = Math.min(t, -hw / dx);       // left edge
  if(!isFinite(t)) t = 0;
  return {x: src.x + dx*t, y: src.y + dy*t};
}

// Compute arc path starting/ending at circle edges (radius 38), not centers.
// For log1 banner edges: straight dashed lines from banner boundary to node edge.
function arcPath(d){
  if(!d.source||!d.target) return '';
  const srcId = d.source.id || d.s;
  if(srcId === 'log1'){
    const exit = bannerExit(d.source, d.target);
    const dx = d.target.x - exit.x, dy = d.target.y - exit.y;
    const len = Math.sqrt(dx*dx+dy*dy);
    if(len < 1) return '';
    const r=46, ux=dx/len, uy=dy/len;
    return `M${exit.x},${exit.y}L${d.target.x-ux*r},${d.target.y-uy*r}`;
  }
  const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y;
  const len=Math.sqrt(dx*dx+dy*dy);
  if(len<1) return '';
  const r=46, ux=dx/len, uy=dy/len;
  const sx=d.source.x+ux*r, sy=d.source.y+uy*r;
  const ex=d.target.x-ux*r, ey=d.target.y-uy*r;
  const dr=len*2.8;
  return `M${sx},${sy}A${dr},${dr} 0 0,1 ${ex},${ey}`;
}

// Position label along arc: chord midpoint + perpendicular offset (follows arc bulge)
function elabelPos(d){
  if(!d.source||!d.target) return 'translate(0,0)';
  const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  // For log1 banner edges use the actual exit point so the label
  // stays on the connector line, not inside the banner rect.
  const start = (d.s==='log1') ? bannerExit(d.source, d.target) : d.source;
  const r=46, ux=dx/len, uy=dy/len;
  const end = {x:d.target.x-ux*r, y:d.target.y-uy*r};
  const mx=(start.x+end.x)/2, my=(start.y+end.y)/2;
  const off=14;
  return `translate(${mx+dy/len*off},${my-dx/len*off})`;
}

// ── Instance label (d.label) inside the circle — wrap at spaces ──
function wrapInstanceLabel(text){
  const words = text.split(' ');
  if(words.length <= 1) return [text];
  if(words.length === 2) return words;
  const mid = Math.ceil(words.length / 2);
  return [words.slice(0,mid).join(' '), words.slice(mid).join(' ')];
}

});

// Resolve docs URL from a raw curl command (used for edge chain steps)
function docsUrlFromCurl(curl){
  const m = curl.match(/https?:\/\/[^\s'"]+/);
  if(!m) return null;
  const p = m[0].replace(/https?:\/\/[^\/]+/,'').split('?')[0];
  if(p.includes('/ai-agents/') && p.includes('/connections') && p.includes('/potential')) return `${BASE_AI}/agentconnections`;
  if(p.includes('/ai-agents/') && p.includes('/connections/'))  return `${BASE_AI}/agentconnections/getresourceconnection`;
  if(p.includes('/ai-agents/') && p.includes('/connections'))   return `${BASE_AI}/agentconnections/listconnections`;
  if(p.includes('/ai-agents/') && p.includes('/lifecycle/activate')) return `${BASE_AI}/agentregistration/activateaiagent`;
  if(p.includes('/ai-agents/'))  return `${BASE_AI}/agentregistration/getaiagent`;
  if(p.includes('/ai-agents'))   return `${BASE_AI}/agentregistration/listaiagents`;
  if(p.includes('/agent-providers'))  return `${BASE_AI}/agentproviders/listaiagentproviders`;
  if(p.includes('/virtual-mcp-servers/') && p.includes('/connections')) return `${BASE_AI}/virtualmcpregistration`;
  if(p.includes('/virtual-mcp-servers'))  return `${BASE_AI}/virtualmcpregistration`;
  if(p.includes('/resource-servers/mcp-servers')) return 'https://developer.okta.com/docs/api/secures-ai/mcp-servers';
  if(p.includes('/delegation-links'))  return `${BASE_AI}/delegationlinks/listdelegationlinks`;
  if(p.includes('/api/v1/apps/') && p.includes('/users'))  return `${BASE_MGMT}/tags/applicationusers`;
  if(p.includes('/api/v1/apps/') && p.includes('/grants')) return `${BASE_MGMT}/tags/applicationgrants`;
  if(p.includes('/api/v1/apps'))  return `${BASE_MGMT}/tags/application/other/listapplications`;
  if(p.includes('/api/v1/authorizationServers/') && p.includes('/policies/') && p.includes('/rules')) return `${BASE_MGMT}/tags/authorizationserverrules`;
  if(p.includes('/api/v1/authorizationServers/') && p.includes('/policies')) return `${BASE_MGMT}/tags/authorizationserverpolicies/other/listauthorizationserverpolicies`;
  if(p.includes('/api/v1/authorizationServers')) return `${BASE_MGMT}/tags/authorizationserver`;
  if(p.includes('/api/v1/users/'))  return `${BASE_MGMT}/tags/user`;
  if(p.includes('/api/v1/users'))   return `${BASE_MGMT}/tags/user/other/listusers`;
  if(p.includes('/api/v1/logs'))    return `${BASE_MGMT}/tags/systemlog/other/listlogevents`;
  return null;
}

function docsUrl(path, method){
  if(path.includes('/ai-agents/{agentId}') && !path.includes('/connections') && !path.includes('/lifecycle')){
    if(method==='PATCH') return `${BASE_AI}/agentregistration/updateaiagent`;
    if(method==='PUT')   return `${BASE_AI}/agentregistration/replaceaiagent`;
  }
  const m = DOCS_MAP.find(([p]) => path.includes(p));
  return m ? m[1] : null;
}

function showNode(node){
  if(!node) return;
  const info=NT[node.type];
  curTab='schema';
  openPanel(info.color, info.label, node.label, [
    {id:'schema', label:'Schema', render:()=>{
      let h='';
      if(node.summary) h+=`<div class="info">${esc(node.summary)}</div>`;
      if(node.orn) h+=`<div class="orn"><strong>ORN:</strong> ${esc(node.orn)}</div>`;
      for(const [grp,fields] of Object.entries(node.schema)){
        h+=`<div class="fgrp"><div class="fgtitle">${esc(grp)}</div>`;
        fields.forEach(f=>{
          h+=`<div class="frow"><span class="fname">${esc(f.n)}</span><div>${f.v?`<div class="fval">${esc(f.v)}</div>`:''  }${f.d?`<div class="fdesc">${esc(f.d)}</div>`:''}</div></div>`;
        });
        h+=`</div>`;
      }
      return h;
    }},
    {id:'apis', label:`APIs (${node.apis.length})`, render:()=>{
      return node.apis.map(a=>`
        <div class="api-card">
          <div class="api-head">
            <span class="method" style="background:${mcol(a.method)}22;color:${mcol(a.method)}">${esc(a.method)}</span>
            <span class="api-title">${esc(a.label)}</span>
            ${docsUrl(a.path,a.method)?`<a class="api-docs" href="${docsUrl(a.path,a.method)}" target="_blank" rel="noopener">docs ↗</a>`:''}
          </div>
          ${a.desc?`<div class="api-desc">${esc(a.desc)}</div>`:''}
          <div class="api-body">
            <div class="code-block">${esc(a.path)}</div>
            <div class="needs-row">
              <span class="needs-label">You need:</span>
              ${[...a.path.matchAll(/\{([^}]+)\}/g)].map(m=>`<span class="needs-chip param">${esc(m[1])}</span>`).join('')}
              <span class="needs-chip token">${a.curl&&a.curl.includes('SSWS')?'SSWS API token':'Bearer access token'}</span>
              ${a.scope?`<span class="needs-chip scope">${esc(a.scope)}</span>`:''}
              ${a.role?`<span class="needs-chip role">${esc(a.role)} role</span>`:''}
            </div>
            ${a.ret?`<div class="frow"><span class="fname">Returns</span><span class="fdesc">${esc(a.ret)}</span></div>`:''}
            <div class="code-block">${esc(a.curl)}<button class="copy-btn" onclick="cp(this)">copy</button></div>
          </div>
        </div>`).join('');
    }},
  ]);
}

function showEdge(edge){
  curTab='correlation';
  const srcNode=nodeMap[edge.s];
  const color=srcNode?NT[srcNode.type].color:'#6366f1';
  openPanel(color,'RELATIONSHIP', edge.rel, [
    {id:'correlation', label:'Identifier Join', render:()=>{
      let h=`<div class="info">${esc(edge.desc)}</div>`;
      h+=`<div class="fgrp"><div class="fgtitle">How These Entities Connect</div>`;
      h+=`<div style="font-size:11.5px;color:#9aa5c8;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;line-height:1.6;margin-bottom:8px">These are the exact field names you use to hop between the two APIs — take the value from one side and plug it into the other.</div>`;
      edge.corr.split('\n').forEach(line=>{
        h+=`<div class="frow"><span class="fval" style="color:#818cf8;font-family:monospace">${esc(line)}</span></div>`;
      });
      h+=`</div>`;
      if(edge.claims){
        h+=`<div class="fgrp"><div class="fgtitle">JWT Token Claims (example)</div>`;
        Object.entries(edge.claims).forEach(([k,v])=>{
          h+=`<div class="frow"><span class="fname">${esc(k)}</span><span class="fval">${esc(v)}</span></div>`;
        });
        h+=`</div>`;
      }
      return h;
    }},
    {id:'chain', label:`API Chain (${edge.chain.length} steps)`, render:()=>{
      let h='';
      if(edge.useWhen) h+=`<div class="use-when"><strong>Use this when:</strong> ${esc(edge.useWhen)}</div>`;
      edge.chain.forEach((step,i)=>{
        const stepDocs = docsUrlFromCurl(step.c);
        h+=`<div class="step-card">
          <div class="step-head">
            <span class="step-num">${i+1}</span>
            <span class="step-title">${esc(step.s)}</span>
            ${stepDocs?`<a class="api-docs" href="${stepDocs}" target="_blank" rel="noopener">docs ↗</a>`:''}
          </div>
          <div class="step-body">
            ${step.d?`<div class="fdesc" style="margin-bottom:5px">${esc(step.d)}</div>`:''}
            <div class="code-block">${esc(step.c)}<button class="copy-btn" onclick="cp(this)">copy</button></div>
          </div>
        </div>`;
        if(i<edge.chain.length-1) h+=`<div class="chain-arrow">↓</div>`;
      });
      return h;
    }},
  ]);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
window.cp=btn=>{ const txt=btn.parentElement.textContent.replace('copy','').trim(); navigator.clipboard.writeText(txt).then(()=>{ btn.textContent='✓'; setTimeout(()=>btn.textContent='copy',1500); }); };

function toggleFlows(){

          <div class="fstep">

              <span class="fstep-n">${si+1}</span>
              <span class="fstep-t">${esc(s.title)}</span>

            <div class="fstep-call">
              <span class="method" style="background:${mcol(s.method)}22;color:${mcol(s.method)};flex-shrink:0">${esc(s.method)}</span>

                <span class="io-lbl">Input</span>

                  <span class="io-n">${esc(r.n)}</span>

                </div>`).join('')}`:''}
              ${s.out&&s.out.length?`
                <span class="io-lbl">Key Response Fields</span>
                ${s.out.map(r=>`<div class="io-row">
                  <span class="io-n">${esc(r.n)}</span>
                  <span class="io-v">${esc(r.v)}</span>
                  ${r.to?`<span class="io-link">→ ${esc(r.to)}</span>`:''}

            </div>

          </div>

}
